# GrantOS — local stack.
#
#   docker compose up -d                  → PostgreSQL only
#                                           (run backend/frontend with npm; best for development)
#   docker compose --profile app up -d    → the whole application in containers
#
# Email is delivered through the SMTP provider configured in backend/.env
# (SMTP_HOST / SMTP_PORT / SMTP_SECURE / SMTP_USER / SMTP_PASS). No mail
# container is part of this stack.
#
# If you want a local capture tool again for development, add one yourself and
# point SMTP_HOST/SMTP_PORT at it — the application needs no code change:
#   docker run -d --name mailpit -p 8025:8025 -p 1025:1025 axllent/mailpit
#
# Host ports are deliberately non-default so this stack never collides with a
# PostgreSQL or dev server you already run. Data and uploads live in named
# volumes, so `docker compose down` (without -v) keeps everything.

name: grantos

services:
  postgres:
    image: postgres:16-alpine
    container_name: grantos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grantos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grantos_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-grantos}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - grantos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grantos} -d ${POSTGRES_DB:-grantos}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: grantos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets (SMTP_PASS, OPENAI_API_KEY, JWT_*) are read from backend/.env and
    # never appear in this file. `environment:` below overrides anything in that
    # file, so only container-specific values are restated here.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      # Inside the network the database is reachable by service name, which the
      # host-oriented value in backend/.env cannot express.
      DATABASE_URL: postgresql://${POSTGRES_USER:-grantos}:${POSTGRES_PASSWORD:-grantos_local_dev}@postgres:5432/${POSTGRES_DB:-grantos}?schema=public
      UPLOAD_DIR: /app/storage/uploads
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - grantos-uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    container_name: grantos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  grantos-pgdata:
    name: grantos-pgdata
  grantos-uploads:
    name: grantos-uploads
  # The grantos-mailpit volume is intentionally no longer declared. It is left
  # on disk rather than removed, so no captured history is destroyed; delete it
  # manually with `docker volume rm grantos-mailpit` if you want the space.
